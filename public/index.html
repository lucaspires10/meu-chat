<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whatsapp Chat - Login</title>
    <link rel="stylesheet" href="style.css" />
    <script src="/socket.io/socket.io.js"></script>
    <script src="login.js" defer></script>
  </head>
  <body>
    <div class="auth-container" id="tela-login">
      <h2>Entrar no Chat</h2>
      <form id="form-login">
        <input
          type="text"
          id="login-usuario"
          placeholder="Nome de usuário"
          required
        />
        <input type="password" id="login-senha" placeholder="Senha" required />
        <button type="submit">Entrar</button>
      </form>
      <p class="auth-toggle">
        Não tem conta?
        <a href="cadastro.html" class="btn-link">Cadastre-se aqui</a>
      </p>
      <div id="login-mensagem" class="erro-msg"></div>
    </div>

    <
    <div class="auth-container" id="tela-conversas" style="display: none">
      <h2>Suas Conversas</h2>
      <p style="color: #8696a0">Selecione uma conversa para acessar:</p>
      <ul id="lista-conversas-ul" class="lista-contatos"></ul>
    </div>

    <div class="chat-container" id="tela-chat" style="display: none">
      <div class="controle">
        <div class="topo-chat">
          <button
            id="btn-voltar"
            title="Voltar"
            style="
              background: none;
              border: none;
              color: #00a884;
              font-size: 1.2rem;
              cursor: pointer;
              margin-right: 10px;
            "
          >
            ⬅ Voltar
          </button>
          <h1>
            ✉️ Conversa ID:
            <span id="id-conversa-titulo" style="color: #fff"></span>
          </h1>
          <button id="btn-limpar" title="Excluir Conversa">
            🗑️ Excluir Conversa
          </button>
        </div>
        <div style="margin-top: 10px; color: #8696a0">
          <span
            >Logado como:
            <strong id="nome-usuario-logado" style="color: #00a884"></strong
          ></span>
        </div>
      </div>

      <div class="painel" id="painel-mensagens"></div>

      <form class="area-envio" id="chat-form">
        <input
          type="text"
          id="campo-mensagem"
          placeholder="Digite uma mensagem"
          required
        />
        <button type="submit">Enviar</button>
      </form>
    </div>
  </body>
</html>
