<html>
  <head>
    <title>Whatsapp chat</title>
    <link rel="stylesheet" href="style.css" />
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="chat-container">
      <div class="controle">
        <div class="topo-chat">
          <h1>✉️ MENSAGENS ✉️</h1>
          <button id="btn-limpar" title="Excluir Conversa">
            🗑️ Excluir Conversa
          </button>
        </div>
        <h3>Converse com seu amigo aqui pelo chat</h3>
        <div style="margin-top: 10px">
          <label style="font-size: 14px">Você é: </label>
          <select id="perfil-usuario" style="padding: 4px; border-radius: 4px">
            <option value="Lucas">Lucas</option>
            <option value="Tiago">Tiago</option>
          </select>
        </div>
      </div>

      <div class="painel" id="painel-mensagens"></div>

      <form class="area-envio" id="chat-form">
        <input
          type="text"
          id="campo-mensagem"
          placeholder="Digite uma mensagem"
          required
        />
        <button type="submit">Enviar</button>
      </form>
    </div>
  </body>
</html>
